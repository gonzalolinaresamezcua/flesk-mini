# Servidor default del panel Flesk (HTTP, IP pública {{PUBLIC_IP}}).
# El panel solo se sirve por HTTPS: /flesk/* redirige 301 a {{PANEL_HTTPS_ORIGIN}}/flesk/...
# ACME (/.well-known/acme-challenge/) sigue en HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    location = /flesk {
        return 301 {{PANEL_HTTPS_ORIGIN}}/flesk/;
    }

    location ^~ /flesk/ {
        return 301 {{PANEL_HTTPS_ORIGIN}}$request_uri;
    }

    location / {
        return 200 'Flesk host ready. Panel: /flesk/\n';
        add_header Content-Type text/plain;
    }
}
