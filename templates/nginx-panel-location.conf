# Panel Flesk en HTTPS: se incluye dentro de un server 443 (dominio del panel o default autofirmado).
# Generado por "flesk panel ssl". HSTS modesto solo en /flesk (sin preload).
location = /flesk {
    return 301 /flesk/;
}

location ^~ /flesk/assets/ {
    alias /opt/flesk/web/assets/;
    expires 7d;
    access_log off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Librerías PHP internas: nunca accesibles por URL
location ^~ /flesk/includes/ {
    return 404;
}

# Adminer (SGBD) tras la sesión del panel: solo index.php ejecuta, sin indexar; X-Frame-Options DENY lo envía Adminer
location ^~ /flesk/sgbd/ {
    alias /opt/flesk/web/public/sgbd/;
    index index.php;
    client_max_body_size 64m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ /\. {
        deny all;
    }
    location = /flesk/sgbd/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/flesk/web/public/sgbd/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:{{PHP_FPM_SOCK}};
        fastcgi_read_timeout 300s;
    }
    location ~ \.php$ {
        return 404;
    }
}

location ^~ /flesk/ {
    alias /opt/flesk/web/public/;
    index index.php;
    client_max_body_size 64m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location ~ /\. {
        deny all;
    }

    location ~ ^/flesk/(.+\.php)$ {
        alias /opt/flesk/web/public/$1;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/flesk/web/public/$1;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:{{PHP_FPM_SOCK}};
        fastcgi_read_timeout 300s;  # agente IA / ZIP grandes
    }
}
