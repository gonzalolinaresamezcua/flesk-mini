; Flesk — pool aislado de {{DOMAIN}} (generado por flesk; no editar a mano: flesk domain isolate {{DOMAIN}})
[flesk-{{DOMAIN}}]
user = {{USER}}
group = {{USER}}
listen = {{SOCK}}
; Solo nginx puede conectar (ni otros dominios ni el propio usuario del sitio)
listen.owner = {{WEB_USER}}
listen.group = {{WEB_USER}}
listen.mode = 0660
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500
chdir = /
security.limit_extensions = .php
env[TMPDIR] = {{VROOT}}/tmp
env[TMP] = {{VROOT}}/tmp
env[TEMP] = {{VROOT}}/tmp
php_admin_value[open_basedir] = {{VROOT}}/httpdocs/:{{VROOT}}/apps/:{{VROOT}}/private/:{{VROOT}}/tmp/:/usr/share/php/:/dev/urandom
php_admin_value[disable_functions] = {{DISABLE_FUNCTIONS}}
php_admin_value[sys_temp_dir] = {{VROOT}}/tmp
php_admin_value[upload_tmp_dir] = {{VROOT}}/tmp
php_admin_value[session.save_path] = {{VROOT}}/tmp/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[soap.wsdl_cache_dir] = {{VROOT}}/tmp
php_admin_value[error_log] = {{VROOT}}/logs/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_include] = off
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
