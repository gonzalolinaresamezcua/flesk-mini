# Flesk — SFTP chroot para grupo sftponly (fase 7)
# Match Group NO debe atrapar root/admin. Termina con Match all porque
# Ubuntu incluye sshd_config.d al inicio del fichero principal.
Match Group sftponly
  ChrootDirectory %h
  ForceCommand internal-sftp -u 0002 -d /httpdocs
  AllowTcpForwarding no
  X11Forwarding no
  AllowAgentForwarding no
  PasswordAuthentication yes
  PubkeyAuthentication no
  PermitTunnel no
  GatewayPorts no
Match all
