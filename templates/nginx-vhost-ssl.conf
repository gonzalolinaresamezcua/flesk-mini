# HTTP: ACME + redirect a HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name {{DOMAIN}} www.{{DOMAIN}};
  access_log /var/www/vhosts/{{DOMAIN}}/logs/access.log;
  access_log /var/log/nginx/flesk-stats.log flesk_json;
  error_log  /var/www/vhosts/{{DOMAIN}}/logs/error.log;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    allow all;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name {{DOMAIN}} www.{{DOMAIN}};
  root /var/www/vhosts/{{DOMAIN}}/httpdocs;
  index index.php index.html;
  access_log /var/www/vhosts/{{DOMAIN}}/logs/access.log;
  access_log /var/log/nginx/flesk-stats.log flesk_json;
  error_log  /var/www/vhosts/{{DOMAIN}}/logs/error.log;
  client_max_body_size 64m;

  ssl_certificate     {{SSL_CERT}};
  ssl_certificate_key {{SSL_KEY}};
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Panel Flesk si este dominio es PANEL_DOMAIN (flesk panel ssl); vacío en el resto
  include /etc/nginx/fresk-panel/{{DOMAIN}}/*.conf;

  # Reglas de servidor de aplicaciones instaladas con Flesk (carpetas privadas denegadas); vacío = nada
  include /etc/nginx/fresk-apps/{{DOMAIN}}/server/*.conf;

  location ~ /\. {
    deny all;
  }

  autoindex off;

  # Flesk Mini: bloqueo por defecto de ficheros sensibles (HTTP estático).
  # ACME: location ^~ /.well-known/acme-challenge/ tiene prioridad.
  # No se bloquea .json.
  location ~* \.(dat|sql|zip|tar|gz|tgz|bak|old|backup|log|env|ini|sh)$ {
    deny all;
  }


  # PHP con PATH_INFO (index.php/ruta, p. ej. back office de PrestaShop); 404 si el script no existe
  location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    if (!-f $document_root$fastcgi_script_name) { return 404; }
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_pass unix:{{PHP_FPM_SOCK}};
  }

  location / {
    try_files $uri $uri/ @fresk_app;
  }

  # Front controller de aplicaciones instaladas con Flesk (flesk app install); vacío = 404
  location @fresk_app {
    include /etc/nginx/fresk-apps/{{DOMAIN}}/*.conf;
    return 404;
  }
}
