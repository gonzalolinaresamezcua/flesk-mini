# Roundcube (webmail.<dominio>) — incluido por los vhosts webmail de Flesk
root /opt/roundcube/public_html;
index index.php;
client_max_body_size 32m;
access_log /var/log/nginx/flesk-webmail.access.log;
error_log  /var/log/nginx/flesk-webmail.error.log;

location ^~ /.well-known/acme-challenge/ {
  root /var/www/letsencrypt;
  allow all;
}
location ~ /\.(?!well-known) { deny all; }
location ~ ^/(config|temp|logs|SQL|bin|installer)(/|$) { deny all; }
location = /installer.php { deny all; }
location ~ ^/(index|static)\.php(/|$) {
  fastcgi_split_path_info ^(.+\.php)(/.*)$;
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_param PATH_INFO $fastcgi_path_info;
  fastcgi_param HTTPS $https if_not_empty;
  fastcgi_pass unix:{{RC_SOCK}};
  fastcgi_read_timeout 120s;
}
location / {
  try_files $uri $uri/ /index.php?$args;
}
