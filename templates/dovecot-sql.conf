driver = mysql
connect = host=127.0.0.1 dbname={{DB_NAME}} user={{DB_USER}} password={{DB_PASSWORD}}
default_pass_scheme = SHA512-CRYPT
password_query = SELECT email AS user, password FROM v_virtual_mailboxes WHERE email='%u' AND active=1
user_query = SELECT CONCAT(IF(maildir LIKE '/%', TRIM(TRAILING '/' FROM maildir), CONCAT('/var/vmail/', TRIM(BOTH '/' FROM maildir))), '/flesk') AS home, CONCAT('maildir:', IF(maildir LIKE '/%', TRIM(TRAILING '/' FROM maildir), CONCAT('/var/vmail/', TRIM(BOTH '/' FROM maildir))), '/') AS mail, {{VMAIL_UID}} AS uid, {{VMAIL_GID}} AS gid, concat('*:bytes=', quota) AS quota_rule FROM v_virtual_mailboxes WHERE email='%u' AND active=1
