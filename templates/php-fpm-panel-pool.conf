; Flesk — pool del panel (usuario dedicado {{PANEL_USER}}, el único con sudo hacia /opt/flesk/bin/flesk)
[flesk-panel]
user = {{PANEL_USER}}
group = {{PANEL_USER}}
listen = {{PANEL_FPM_SOCK}}
listen.owner = {{WEB_USER}}
listen.group = {{WEB_USER}}
listen.mode = 0660
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5
chdir = /
security.limit_extensions = .php
env[TMPDIR] = {{FRESK_ROOT}}/var/tmp
php_admin_value[session.save_path] = {{FRESK_ROOT}}/var/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[sys_temp_dir] = {{FRESK_ROOT}}/var/tmp
php_admin_value[upload_tmp_dir] = {{FRESK_ROOT}}/var/tmp
php_admin_flag[expose_php] = off
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
