# Servidor HTTPS por defecto (IP pública / SNI desconocido). Certificado autofirmado (SAN=IP).
# Contenido del panel según modo: /etc/nginx/fresk-panel/_default/*.conf
#   - sin PANEL_DOMAIN: panel servido aquí (aviso del navegador por autofirmado)
#   - con PANEL_DOMAIN: redirección 301 a https://PANEL_DOMAIN/flesk/
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/flesk/panel-selfsigned.crt;
    ssl_certificate_key /etc/ssl/flesk/panel-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/fresk-panel/_default/*.conf;

    location / {
        return 200 'Flesk host ready. Panel: /flesk/\n';
        add_header Content-Type text/plain;
    }
}
