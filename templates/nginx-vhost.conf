server {
  listen 80;
  listen [::]:80;
  server_name {{DOMAIN}} www.{{DOMAIN}};
  root /var/www/vhosts/{{DOMAIN}}/httpdocs;
  index index.php index.html;
  access_log /var/www/vhosts/{{DOMAIN}}/logs/access.log;
  access_log /var/log/nginx/flesk-stats.log flesk_json;
  error_log  /var/www/vhosts/{{DOMAIN}}/logs/error.log;
  client_max_body_size 64m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    allow all;
  }

  # Reglas de servidor de aplicaciones instaladas con Flesk (carpetas privadas denegadas); vacío = nada
  include /etc/nginx/fresk-apps/{{DOMAIN}}/server/*.conf;

  location ~ /\. {
    deny all;
  }

  # PHP con PATH_INFO (index.php/ruta, p. ej. back office de PrestaShop); 404 si el script no existe
  location ~ [^/]\.php(/|$) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    if (!-f $document_root$fastcgi_script_name) { return 404; }
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_pass unix:{{PHP_FPM_SOCK}};
  }

  location / {
    try_files $uri $uri/ @fresk_app;
  }

  # Front controller de aplicaciones instaladas con Flesk (flesk app install); vacío = 404
  location @fresk_app {
    include /etc/nginx/fresk-apps/{{DOMAIN}}/*.conf;
    return 404;
  }
}
