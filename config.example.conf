# Flesk — ejemplo de configuración (copiar a config.conf; no versionar config.conf)
# Generado/editado por install.sh. Modo 640, dueño root:fresk.

# Dominio del panel. Vacío = servir por IP + ruta /flesk (sin LE hasta tener dominio real).
PANEL_DOMAIN=

# Ruta URL del panel cuando no hay PANEL_DOMAIN (decisión: http://PUBLIC_IP/flesk)
PANEL_BASE_PATH=/flesk

# Email del administrador. Placeholder hasta dominio real (LE del panel espera).
ADMIN_EMAIL=admin@localhost

# IP pública del servidor (detectada en install si queda vacía)
PUBLIC_IP=

# Email para Let's Encrypt (por defecto = ADMIN_EMAIL; no emitir hasta dominio real)
LE_EMAIL=

# Base de datos del panel
DB_HOST=127.0.0.1
DB_NAME=fresk
DB_USER=fresk_panel
DB_PASS_FILE=/opt/flesk/var/.dbpass
DB_ADMIN_USER=fresk_admin
DB_ADMIN_PASS_FILE=/opt/flesk/var/.dbadminpass

# Usuarios de sistema
WEB_USER=www-data
FRESK_USER=fresk
VMAIL_UID=5000
VMAIL_GID=5000
VMAIL_HOME=/var/vmail

# PHP
PHP_VERSION=8.3
PHP_FPM_SOCK=/run/php/php8.3-fpm-fresk.sock

# Rutas
FRESK_ROOT=/opt/flesk
VHOSTS_ROOT=/var/www/vhosts
NGINX_ENABLED=/etc/nginx/fresk-enabled
BIND_ZONES=/etc/bind/fresk

# DNS público (yes solo tras fase 5 y decisión explícita)
DNS_PUBLIC=no

# Panel web: por IP+path /flesk; puerto 8443 opcional de respaldo
PANEL_PORT=8443

# Estadísticas: días que se conservan las peticiones y accesos (flesk stats ingest)
STATS_RETENTION_DAYS=90
